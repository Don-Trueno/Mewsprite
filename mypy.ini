; Type checking for the Mewgenics export pipeline.
;
;   .venv\Scripts\python.exe -m mypy            # check everything under `files`
;   .venv\Scripts\python.exe -m mypy -p src.custom_cats
;
; `mypy_path` has to point at the repository root because the code uses
; package-relative imports (`from .catgen import ...`) that only resolve when
; `src` is importable as a package.

[mypy]
python_version = 3.13
mypy_path = .
; `src` is a package whose modules use relative imports, so mypy has to derive
; module names from the package root rather than treating each file as a script
explicit_package_bases = True
files = src, main.py, svg_to_png.py

exclude = (?x)(
    ^\.venv/
    | ^\.mypy_cache/
    | ^cache/
    | ^data/
    | ^out/
    | ^reusable/
    | ^Mewgenics-Level-Editor/
    | ^tests/
    )

show_error_codes = True
show_column_numbers = False
pretty = False

; the third-party packages this project leans on ship no stubs
ignore_missing_imports = True

; still check the bodies of functions that carry no annotations
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
